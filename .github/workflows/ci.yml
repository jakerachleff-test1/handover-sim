name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pytest -q
      - name: show secret presence
        run: 'test -n "$DEPLOY_TOKEN" && echo "DEPLOY_TOKEN is set" || echo "DEPLOY_TOKEN is MISSING"'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
